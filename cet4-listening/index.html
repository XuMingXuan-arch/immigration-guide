<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级听力练习 · CET-4 Listening</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#9aa3b2; --accent:#4c8eff; --accent2:#7c5cff;
    --ok:#3dd68c; --warn:#f5b041; --err:#ef5f6b;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;font-size:15px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header.top{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 16px}
  .top-row{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .brand{font-weight:700;font-size:17px;letter-spacing:.5px}
  .brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  .top-spacer{flex:1}
  .top-link{font-size:13px;color:var(--muted)}
  .top-link:hover{color:var(--text)}
  main{max-width:920px;margin:0 auto;padding:16px 16px 80px}
  .search{width:100%;margin:14px 0 6px;padding:11px 14px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .year-group{margin:18px 0 6px}
  .year-h{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px;
    border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:10px}
  .paper-card{display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:border-color .15s,transform .1s}
  .paper-card:hover{border-color:var(--accent)}
  .paper-card:active{transform:scale(.99)}
  .pc-main{flex:1;min-width:0}
  .pc-title{font-weight:600;font-size:15px}
  .pc-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .tag-sample{background:rgba(124,92,255,.15);color:#b8a4ff;border-color:rgba(124,92,255,.4)}
  .tag-ready{background:rgba(61,214,140,.12);color:var(--ok);border-color:rgba(61,214,140,.35)}
  .tag-pending{background:rgba(154,163,178,.12);color:var(--muted);border-color:rgba(154,163,178,.3)}
  .progress-ring{width:34px;height:34px;flex:none}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* paper view */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:14px}
  .back:hover{color:var(--text)}
  .paper-head{margin:6px 0 18px}
  .paper-head h1{margin:0 0 4px;font-size:21px}
  .paper-note{color:var(--warn);font-size:13px;background:rgba(245,176,65,.08);
    border:1px solid rgba(245,176,65,.25);border-radius:8px;padding:8px 12px;margin-top:8px}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:18px;overflow:hidden}
  .section-h{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .section-h h2{margin:0;font-size:16px}
  .section-h .dirs{margin:8px 0 0;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
  .passage{border-bottom:1px solid var(--border);padding:14px 16px}
  .passage:last-child{border-bottom:none}
  .pass-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pass-label{font-weight:600;font-size:14px}
  .pass-timestamp{font-size:12px;color:var(--muted)}
  .player{margin:10px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#000}
  .player iframe,.player audio{display:block;width:100%;border:0;min-height:46px}
  .player iframe{min-height:180px}
  .play-hint{font-size:12px;color:var(--muted);margin:6px 0}
  .audio-link-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  .audio-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,#4c8eff,#7c5cff);border-radius:8px;
    padding:9px 14px;text-decoration:none}
  .audio-link:hover{filter:brightness(1.12);text-decoration:none}
  .q{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin:10px 0}
  .q-no{font-weight:700;color:var(--accent);font-size:13px}
  .q-stem{margin:4px 0 10px;font-size:14.5px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--border);
    border-radius:8px;cursor:pointer;font-size:14px;transition:background .12s,border-color .12s}
  .opt:hover{background:rgba(76,142,255,.08)}
  .opt.sel{border-color:var(--accent);background:rgba(76,142,255,.12)}
  .opt.correct{border-color:var(--ok);background:rgba(61,214,140,.12)}
  .opt.wrong{border-color:var(--err);background:rgba(239,95,107,.12)}
  .opt-mark{flex:none;width:20px;font-weight:700}
  .q-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn-pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-pri:disabled{opacity:.5;cursor:not-allowed}
  .transcript{margin-top:10px;padding:12px 14px;background:rgba(76,142,255,.06);
    border:1px solid rgba(76,142,255,.25);border-radius:8px;font-size:13.5px;white-space:pre-wrap;display:none}
  .transcript.show{display:block}
  .transcript h4{margin:0 0 6px;font-size:12px;color:var(--accent)}
  .pass-result{font-size:12.5px;color:var(--muted);margin-top:8px}
  .pass-result b{color:var(--ok)}
  .nav-row{display:flex;justify:space-between;gap:10px;margin-top:22px}
  .nav-row .btn{flex:1;text-align:center}
  .guide{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
    padding:16px;margin:18px 0;font-size:13.5px;color:var(--muted)}
  .guide h3{margin:0 0 8px;color:var(--text);font-size:15px}
  .guide code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:#ffd479}
  footer{max-width:920px;margin:0 auto;padding:20px 16px 40px;font-size:12px;color:var(--muted);
    border-top:1px solid var(--border);text-align:center}
  @media(min-width:640px){main{padding:20px 16px 90px}.paper-card{padding:16px 18px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">四级听力 <small>CET-4 Listening</small></div>
    <div class="top-spacer"></div>
    <a class="top-link" href="#/guide">录入指南</a>
  </div>
</header>
<main id="app"></main>
<footer>四级听力练习 · 数据来自用户自备真题原文 · 仅供个人学习</footer>
<script src="papers.js"></script>
<script>
/* ===== 路由 ===== */
const app = document.getElementById('app');
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if(!h || h==='guide' && false){ }
  if(h === 'guide'){ renderGuide(); return; }
  if(h.indexOf('paper/')===0){ renderPaper(decodeURIComponent(h.slice(6))); return; }
  renderHome();
}
window.addEventListener('hashchange', route);

/* ===== 进度存储 ===== */
const PKEY = 'cet4_progress_v1';
function loadProgress(){ try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return {};} }
function saveProgress(p){ localStorage.setItem(PKEY, JSON.stringify(p)); }
function setAnswer(pid, qno, correct){
  const p = loadProgress();
  p[pid] = p[pid]||{};
  p[pid][qno] = correct?1:0;
  saveProgress(p);
}
function paperDoneCount(pid){
  const p = loadProgress()[pid]||{};
  return Object.values(p).filter(v=>v===1).length;
}

/* ===== 首页 ===== */
function renderHome(){
  const q = (document.querySelector('.search')?.value||'').trim().toLowerCase();
  const papers = (window.PAPERS||[]).slice().sort((a,b)=>{
    if(b.year!==a.year) return b.year-a.year;
    return (b.session||'').localeCompare(a.session||'');
  }).filter(p=> !q || (p.title||'').toLowerCase().includes(q));
  // 按年分组
  const byYear = {};
  papers.forEach(p=>{ (byYear[p.year] = byYear[p.year]||[]).push(p); });
  const years = Object.keys(byYear).sort((a,b)=>b-a);

  let h = `<input class="search" placeholder="搜索试卷，如 2024年6月 / 2019" value="${q.replace(/"/g,'&quot;')}" oninput="renderHome()" />`;
  h += `<div class="top-spacer" style="margin:4px 0 0"></div>`;
  if(!papers.length){ h += `<div class="empty">没有匹配的试卷</div>`; }
  years.forEach(y=>{
    h += `<div class="year-group"><div class="year-h">${y} 年</div>`;
    byYear[y].forEach(p=>{
      const st = window.PAPER_STATUS[p.status] || window.PAPER_STATUS.pending;
      const total = (p.sections||[]).reduce((s,sec)=>s+(sec.passages||[]).reduce((ss,pa)=>ss+(pa.questions||[]).length,0),0);
      const done = paperDoneCount(p.id);
      const pct = total? Math.round(done/total*100):0;
      h += `<div class="paper-card" onclick="location.hash='#/paper/${encodeURIComponent(p.id)}'">
        <div class="pc-main">
          <div class="pc-title">${p.title||p.id}</div>
          <div class="pc-sub">${total? done+'/'+total+' 题已掌握 · '+pct+'%' : '点击进入'}</div>
        </div>
        <span class="tag ${st.cls}">${st.tag}</span>
        ${total? ring(pct):''}
      </div>`;
    });
    h += `</div>`;
  });
  app.innerHTML = h;
}
function ring(pct){
  const r=14,c=2*Math.PI*r,len=2*Math.PI*r,off=len*(1-pct/100);
  const col = pct>=80?'#3dd68c':pct>=40?'#f5b041':'#4c8eff';
  return `<svg class="progress-ring" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="#2a2f3a" stroke-width="4"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${col}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${off}"
      transform="rotate(-90 18 18)"/>
    <text x="18" y="21" text-anchor="middle" font-size="9" fill="${col}">${pct}</text>
  </svg>`;
}

/* ===== 试卷页 ===== */
function renderPaper(pid){
  const p = (window.PAPERS||[]).find(x=>x.id===pid);
  if(!p){ app.innerHTML=`<div class="empty">未找到试卷：${pid}</div><a href="#/">返回</a>`; return; }
  const st = window.PAPER_STATUS[p.status] || window.PAPER_STATUS.pending;
  const total = (p.sections||[]).reduce((s,sec)=>s+(sec.passages||[]).reduce((ss,pa)=>ss+(pa.questions||[]).length,0),0);
  const done = paperDoneCount(p.id);

  let h = `<a class="back" href="#/" onclick="location.hash='#/'">← 返回列表</a>`;
  h += `<div class="paper-head"><h1>${p.title||p.id}</h1>`;
  h += `<span class="tag ${st.cls}">${st.tag}</span>`;
  if(total) h += ` <span style="font-size:13px;color:var(--muted);margin-left:6px">已掌握 ${done}/${total} 题</span>`;
  if(p.note) h += `<div class="paper-note">${p.note}</div>`;
  h += `</div>`;

  if(!p.sections || !p.sections.length){
    h += `<div class="guide"><h3>该试卷待录入</h3>
      <p>给我这套的<b>两个 B站视频</b>：一个“题目+音频”，一个“音频+原文”。我提取后，网站会显示题目、答案和原文。</p>
      <p><a href="#/guide">查看录入指南 →</a></p></div>`;
    app.innerHTML = h; return;
  }

  p.sections.forEach(sec=>{
    h += `<div class="section"><div class="section-h"><h2>${sec.name}</h2>`;
    if(sec.directions) h += `<div class="dirs">${sec.directions}</div>`;
    h += `</div>`;
    (sec.passages||[]).forEach(pa=>{
      h += renderPassage(p.id, pa);
    });
    h += `</div>`;
  });

  // 上下卷导航
  const list = (window.PAPERS||[]).slice().sort((a,b)=>(b.year-a.year)||(b.session||'').localeCompare(a.session||''));
  const i = list.findIndex(x=>x.id===pid);
  const prev = i>0?list[i-1]:null, next = i<list.length-1?list[i+1]:null;
  h += `<div class="nav-row">`;
  h += prev? `<a class="btn" href="#/paper/${encodeURIComponent(prev.id)}">← ${prev.title||prev.id}</a>` : `<span></span>`;
  h += next? `<a class="btn" href="#/paper/${encodeURIComponent(next.id)}">${next.title||next.id} →</a>` : `<span></span>`;
  h += `</div>`;

  app.innerHTML = h;
}

function renderPassage(pid, pa){
  let h = `<div class="passage" id="${pid}-${pa.id}">`;
  h += `<div class="pass-head">
    <span class="pass-label">${pa.label||pa.id}</span>
    ${pa.media&&pa.media.t? `<span class="pass-timestamp">▸ 起始 ${fmtTime(pa.media.t)}</span>`:''}
  </div>`;
  // 播放器（仅当配置了 media 时显示；真题通常只保留题目/答案/原文）
  if(pa.media && pa.media.type){
    h += renderPlayer(pa.media);
  }
  // 题目
  (pa.questions||[]).forEach(q=>{
    h += renderQuestion(pid, pa.id, q);
  });
  if(!pa.questions || !pa.questions.length){
    h += `<div class="pass-result">该段暂无题目（可先听音频、看原文）</div>`;
  }
  // 原文
  if(pa.transcript){
    h += `<div class="transcript" id="tr-${pid}-${pa.id}"><h4>听力原文</h4>${pa.transcript}</div>`;
    h += `<div class="q-actions"><button class="btn" onclick="var e=document.getElementById('tr-${pid}-${pa.id}');e.classList.toggle('show')">显示/隐藏原文</button></div>`;
  }
  h += `</div>`;
  return h;
}

function renderPlayer(media){
  if(!media || !media.type) return `<div class="play-hint">（该段未配置音频，可自行播放对应音频对照练习）</div>`;
  if(media.type==='bilibili'){
    if(!media.bvid) return `<div class="play-hint">B站音频待填：在 papers.js 填入 bvid 与 t（起始秒）</div>`;
    const url = `https://www.bilibili.com/video/${media.bvid}${media.t?`?t=${media.t}`:''}`;
    let h = `<div class="audio-link-row">
      <a class="audio-link" href="${url}" target="_blank" rel="noopener">▶ 在B站播放此段${media.t?`（从 ${fmtTime(media.t)} 开始）`:''}</a>
      <button class="btn" onclick="toggleEmbed(this,'${media.bvid}',${media.page||1},${media.t||0})">嵌入播放器</button>
    </div>`;
    h += `<div class="player" style="display:none"></div>`;
    return h;
  }
  if(media.type==='mp3'){
    return `<div class="player"><audio controls preload="metadata" src="${media.src||''}" ${media.t?`onloadedmetadata="this.currentTime=${media.t}"`:''}></audio></div>`;
  }
  return `<div class="play-hint">未知音频类型</div>`;
}
function toggleEmbed(btn,bvid,page,t){
  const wrap = btn.closest('.audio-link-row').nextElementSibling;
  if(wrap.style.display!=='none'){
    wrap.style.display='none'; wrap.innerHTML=''; btn.textContent='嵌入播放器'; return;
  }
  wrap.style.display='block';
  let src = `https://player.bilibili.com/player.html?bvid=${bvid}&page=${page}&high_quality=1&danmaku=0&as_wide=1`;
  if(t) src += `&t=${t}`;
  wrap.innerHTML = `<iframe src="${src}" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>`;
  btn.textContent='收起播放器';
}

function renderQuestion(pid, paid, q){
  const qid = `q-${pid}-${paid}-${q.no}`;
  let h = `<div class="q" id="${qid}" data-pid="${pid}" data-paid="${paid}" data-no="${q.no}" data-ans="${q.answer||''}">`;
  h += `<div class="q-no">第 ${q.no} 题</div>`;
  h += `<div class="q-stem">${q.stem||''}</div>`;
  h += `<div class="opts">`;
  (q.options||[]).forEach((op,i)=>{
    const letter = op.trim().match(/^([A-D])/);
    const mk = letter? letter[1] : String.fromCharCode(65+i);
    const txt = op.replace(/^[A-D]\)\s*/,'');
    h += `<div class="opt" data-mk="${mk}" onclick="pickOpt(this)"><span class="opt-mark">${mk}</span><span>${txt}</span></div>`;
  });
  h += `</div>`;
  h += `<div class="q-actions">
    <button class="btn btn-pri" onclick="checkQ('${pid}','${paid}',${q.no})" ${q.answer? '' : 'disabled'}>提交</button>
    <button class="btn" onclick="resetQ('${pid}','${paid}',${q.no})">重做</button>
  </div>`;
  h += `<div class="pass-result" id="r-${pid}-${paid}-${q.no}"></div>`;
  h += `</div>`;
  return h;
}

/* ===== 答题交互 ===== */
function pickOpt(el){
  const q = el.closest('.q');
  if(q.classList.contains('locked')) return;
  q.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  q.dataset.picked = el.dataset.mk;
}
function checkQ(pid,paid,no){
  const q = document.getElementById(`q-${pid}-${paid}-${no}`);
  if(!q) return;
  const picked = q.dataset.picked, ans = q.dataset.ans;
  if(!picked){ alert('请先选择一个选项'); return; }
  q.querySelectorAll('.opt').forEach(o=>{
    if(o.dataset.mk===ans) o.classList.add('correct');
    else if(o.dataset.mk===picked) o.classList.add('wrong');
  });
  q.classList.add('locked');
  const ok = picked===ans;
  const r = document.getElementById(`r-${pid}-${paid}-${no}`);
  r.innerHTML = ok ? `<b>✓ 正确</b>` : `✗ 你选 ${picked}，正确答案 <b>${ans}</b>`;
  setAnswer(pid, no, ok);
  // 更新首页进度会在返回时刷新
}
function resetQ(pid,paid,no){
  const q = document.getElementById(`q-${pid}-${paid}-${no}`);
  if(!q) return;
  q.classList.remove('locked');
  q.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrong'));
  delete q.dataset.picked;
  document.getElementById(`r-${pid}-${paid}-${no}`).innerHTML='';
}

function fmtTime(s){
  s = Math.max(0, s|0);
  const m=(s/60)|0, ss=s%60;
  return `${m}:${ss<10?'0':''}${ss}`;
}

/* ===== 录入指南 ===== */
function renderGuide(){
  app.innerHTML = `
  <a class="back" href="#/" onclick="location.hash='#/'">← 返回列表</a>
  <div class="guide">
    <h3>怎么录入一套真题</h3>
    <p>你给我一组两个 B站视频，我整合进网站：</p>
    <ol style="line-height:2">
      <li><b>视频1：题目 + 音频</b> —— 我用 OCR 提取题干、A-D 选项，并从视频描述里拿参考答案。</li>
      <li><b>视频2：音频 + 原文</b> —— 我用 OCR 提取完整听力原文（含 passage 和 question stems）。</li>
    </ol>
    <p><b>网站只保留三样东西：</b>题目 → 答题 → 对答案 → 展开原文。<b>音频你自己在 B 站听</b>，网站不再放播放器。</p>
    <p style="margin-top:14px"><b>提示：</b>由于 OCR 识别烧录字幕/画面文字可能存在个别错误，如果你发现题目或原文有明显问题，直接告诉我，我修正。</p>
    <p><a href="#/" onclick="location.hash='#/'">← 返回练习</a></p>
  </div>`;
}
    <p><b>你提供：</b></p>
    <ol style="line-height:2">
      <li>该套的<b>听力原文</b>（文字稿，整段粘贴给我即可）。</li>
      <li>该套的<b>B站视频链接 / BV号</b>；若整套在一个视频里，再告诉我每一段的起始时间（分:秒）。</li>
    </ol>
    <p><b>我来做：</b>从原文里提取题目（四级录音会念题干，原文里就有）→ 生成 A-D 选项 → 根据原文内容推定正确答案 → 录入 <code>papers.js</code> 并上线。</p>
